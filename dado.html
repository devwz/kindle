<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=600, initial-scale=1">
	<meta name="theme-color" content="#FFFFFF">
	<meta name="description" content="Dado tridimensional giratório em 16 tons de cinza para uma tela Kindle de 600 por 800 pixels.">
	<title>Dado em movimento | Kindle</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #FFFFFF;
			--ink: #111111;
			--muted: #666666;
			--rule: #CCCCCC;
			--soft: #EEEEEE;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			min-height: 100%;
			margin: 0;
		}

		body {
			display: grid;
			min-height: 100vh;
			place-items: center;
			overflow: auto;
			background: #DDDDDD;
			color: var(--ink);
			font-family: Georgia, "Times New Roman", serif;
		}

		.screen {
			position: relative;
			display: grid;
			grid-template-rows: 76px 1fr 76px;
			width: min(600px, 100vw);
			aspect-ratio: 3 / 4;
			overflow: hidden;
			background: var(--paper);
			box-shadow: 8px 8px 0 #888888;
		}

		.masthead,
		.footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin: 0 42px;
		}

		.masthead {
			border-bottom: 1px solid var(--rule);
		}

		.brand {
			font-size: 15px;
			font-weight: bold;
			letter-spacing: 0;
		}

		.edition,
		.specs,
		.footer-label {
			color: var(--muted);
			font-family: "Courier New", monospace;
			font-size: 11px;
			letter-spacing: 0;
		}

		.scene {
			display: grid;
			position: relative;
			place-items: center;
			overflow: hidden;
		}

		.scene::before,
		.scene::after {
			position: absolute;
			left: 50%;
			width: 250px;
			height: 1px;
			background: var(--soft);
			content: "";
			transform: translateX(-50%);
		}

		.scene::before {
			top: 24%;
		}

		.scene::after {
			bottom: 24%;
		}

		.cube-wrap {
			display: grid;
			width: 250px;
			height: 250px;
			place-items: center;
			perspective: 760px;
		}

		.cube {
			position: relative;
			width: 164px;
			height: 164px;
			transform: rotateX(-24deg) rotateY(-34deg);
			transform-style: preserve-3d;
			transition: transform 900ms cubic-bezier(.2, .7, .2, 1);
			will-change: transform;
		}

		.face {
			position: absolute;
			display: grid;
			width: 164px;
			height: 164px;
			place-items: center;
			border: 2px solid #111111;
			backface-visibility: hidden;
		}

		.front {
			background: #CCCCCC;
			transform: translateZ(82px);
		}

		.back {
			background: #777777;
			transform: rotateY(180deg) translateZ(82px);
		}

		.right {
			background: #999999;
			transform: rotateY(90deg) translateZ(82px);
		}

		.left {
			background: #BBBBBB;
			transform: rotateY(-90deg) translateZ(82px);
		}

		.top {
			background: #EEEEEE;
			transform: rotateX(90deg) translateZ(82px);
		}

		.bottom {
			background: #555555;
			transform: rotateX(-90deg) translateZ(82px);
		}

		.pips {
			display: grid;
			width: 100%;
			height: 100%;
			padding: 25px;
			grid-template-columns: repeat(3, 1fr);
			grid-template-rows: repeat(3, 1fr);
		}

		.pip {
			width: 15px;
			height: 15px;
			place-self: center;
			border-radius: 50%;
			background: #111111;
		}

		.top-left {
			grid-area: 1 / 1;
		}

		.top-right {
			grid-area: 1 / 3;
		}

		.middle-left {
			grid-area: 2 / 1;
		}

		.center {
			grid-area: 2 / 2;
		}

		.middle-right {
			grid-area: 2 / 3;
		}

		.bottom-left {
			grid-area: 3 / 1;
		}

		.bottom-right {
			grid-area: 3 / 3;
		}

		.bottom .pip {
			background: #FFFFFF;
		}

		.footer {
			border-top: 1px solid var(--rule);
		}

		.footer-label {
			line-height: 1.8;
		}

		.toggle {
			min-width: 104px;
			padding: 10px 12px;
			border: 1px solid var(--ink);
			border-radius: 0;
			background: var(--paper);
			color: var(--ink);
			cursor: pointer;
			font-family: "Courier New", monospace;
			font-size: 11px;
		}

		.toggle:hover,
		.toggle:focus-visible {
			background: var(--ink);
			color: var(--paper);
		}

		.toggle:focus-visible {
			outline: 2px solid #666666;
			outline-offset: 3px;
		}

		@media (max-width: 420px) {
			.screen {
				grid-template-rows: 64px 1fr 72px;
			}

			.masthead,
			.footer {
				margin-right: 22px;
				margin-left: 22px;
			}

			.cube-wrap {
				transform: scale(.82);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.cube {
				transition: none;
			}
		}
	</style>
</head>
<body>
	<main class="screen" aria-label="Demonstração de dado para Kindle">
		<header class="masthead">
			<div class="brand">ESTUDO Nº 01</div>
			<div class="edition">OBJETO EM MOVIMENTO</div>
		</header>

		<section class="scene" aria-label="Dado tridimensional em rotação">
			<div class="cube-wrap">
				<div class="cube" id="cube" role="img" aria-label="Dado de seis lados, com as faces de um a seis">
					<div class="face front"><div class="pips"><span class="pip center"></span></div></div>
					<div class="face back"><div class="pips"><span class="pip top-left"></span><span class="pip top-right"></span><span class="pip middle-left"></span><span class="pip middle-right"></span><span class="pip bottom-left"></span><span class="pip bottom-right"></span></div></div>
					<div class="face right"><div class="pips"><span class="pip top-right"></span><span class="pip bottom-left"></span></div></div>
					<div class="face left"><div class="pips"><span class="pip top-left"></span><span class="pip top-right"></span><span class="pip center"></span><span class="pip bottom-left"></span><span class="pip bottom-right"></span></div></div>
					<div class="face top"><div class="pips"><span class="pip top-left"></span><span class="pip center"></span><span class="pip bottom-right"></span></div></div>
					<div class="face bottom"><div class="pips"><span class="pip top-left"></span><span class="pip top-right"></span><span class="pip bottom-left"></span><span class="pip bottom-right"></span></div></div>
				</div>
			</div>
		</section>

		<footer class="footer">
			<div class="footer-label">600 × 800 PX<br>167 PPI · 16 TONS</div>
			<button class="toggle" id="toggle" type="button" aria-pressed="false">PAUSAR</button>
		</footer>
	</main>

	<script>
		const cube = document.querySelector("#cube");
		const toggle = document.querySelector("#toggle");
		const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
		let rotationX = -24;
		let rotationY = -34;
		let timer;

		function advanceCube() {
			rotationY += 45;
			rotationX += 15;
			cube.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
		}

		function startAnimation() {
			if (!reducedMotion.matches && !timer) {
				timer = window.setInterval(advanceCube, 1000);
			}
		}

		function stopAnimation() {
			window.clearInterval(timer);
			timer = undefined;
		}

		toggle.addEventListener("click", () => {
			const isPaused = toggle.getAttribute("aria-pressed") === "true";
			toggle.setAttribute("aria-pressed", String(!isPaused));
			toggle.textContent = isPaused ? "PAUSAR" : "RETOMAR";
			isPaused ? startAnimation() : stopAnimation();
		});

		reducedMotion.addEventListener("change", () => {
			reducedMotion.matches ? stopAnimation() : startAnimation();
		});

		startAnimation();
	</script>
</body>
</html>
